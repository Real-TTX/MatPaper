name: Build and push Docker image

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests that start the whole app need PostgreSQL (MATPAPER_TEST_DB); each test class creates and drops a database of its own there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: matpaper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MatPaper.slnx

      - name: Build
        run: dotnet build MatPaper.slnx -c Release --no-restore

      - name: Test
        env:
          MATPAPER_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=matpaper
        # The GitHubActions logger shows every failed test as an annotation of the run.
        run: dotnet test MatPaper.slnx -c Release --no-build --verbosity normal --logger GitHubActions

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute date
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Compute version and tags
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="1.0.${{ github.run_number }}-${{ steps.date.outputs.date }}"
            TAGS="ghcr.io/real-ttx/matpaper:${VERSION}
          ghcr.io/real-ttx/matpaper:latest"
          else
            VERSION="nightly-${{ github.run_number }}-${{ steps.date.outputs.date }}"
            TAGS="ghcr.io/real-ttx/matpaper:${VERSION}
          ghcr.io/real-ttx/matpaper:nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
