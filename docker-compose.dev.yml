services:
  matpaper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4994:8080"
    volumes:
      - matpaper-data:/data
      - matpaper-storage:/storage
    environment:
      APP_VERSION: local
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: matpaper
      POSTGRES_DB: matpaper
    volumes:
      - matpaper-db:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "4995:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matpaper.local
      PGADMIN_DEFAULT_PASSWORD: matpaper
    depends_on:
      - db

volumes:
  matpaper-data:
  matpaper-db:
  matpaper-storage:
