services:
  matpaper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4994:8080"
    volumes:
      - matpaper-data:/data
      - matpaper-storage:/storage
      # Keep the review inbox off the container host, e.g. on the NAS:
      #   - matpaper-inbox:/inbox        (+ MATPAPER_INBOX: /inbox below, volume defined at the bottom)
    environment:
      APP_VERSION: local
      # MATPAPER_INBOX: /inbox
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: matpaper
      POSTGRES_DB: matpaper
    volumes:
      - matpaper-db:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "4995:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matpaper.local
      PGADMIN_DEFAULT_PASSWORD: matpaper
    depends_on:
      - db

volumes:
  matpaper-data:
  matpaper-db:
  matpaper-storage:
  # NAS share mounted by Docker (CIFS) — usable for /inbox or as a local storage location:
  # matpaper-inbox:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: "addr=nas.local,username=matpaper,password=secret,uid=1000,gid=1000,file_mode=0660,dir_mode=0770"
  #     device: "//nas.local/matpaper-inbox"
