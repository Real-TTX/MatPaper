# The simple setup from the README ("Quick start"): the prebuilt image plus PostgreSQL.
# docker compose -f docker-compose.release.yml up -d   ->  http://localhost:4994
services:
  matpaper:
    image: ghcr.io/real-ttx/matpaper:latest
    restart: unless-stopped
    ports:
      - "4994:8080"
    volumes:
      - matpaper-data:/data
      - matpaper-storage:/storage
      # Keep the review inbox off the container host, e.g. on a NAS (see README, "Data"):
      #   - /volume1/inbox:/inbox        (+ MATPAPER_INBOX: /inbox)
    # environment:
    #   MATPAPER_INBOX: /inbox
    #   MATPAPER_TZ: Europe/Berlin
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: matpaper
      POSTGRES_DB: matpaper
    volumes:
      - matpaper-db:/var/lib/postgresql/data

volumes:
  matpaper-data:
  matpaper-storage:
  matpaper-db:
