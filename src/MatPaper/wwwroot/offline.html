<!DOCTYPE html>
<!-- The page of the service worker when the server cannot be reached: the toolkit and the style sheet of the app come from its cache, nothing else is needed. -->
<html lang="de" data-app="matpaper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#268538" />
  <title>MatPaper - Offline</title>
  <script src="/matui/matui.boot.js"></script>
  <link rel="stylesheet" href="/matui/matui.css" />
  <link rel="stylesheet" href="/css/matpaper.css" />
</head>
<body>
  <main class="mat-auth" id="main">
    <div class="mat-auth__card">
      <div class="mat-auth__brand">
        <span class="mat-logo mat-logo--lg" role="img" aria-label="MatPaper">
          <svg class="mat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /></svg>
        </span>
        <h1>MatPaper ist offline</h1>
        <p class="mat-muted">Es besteht derzeit keine Verbindung zum Server.</p>
      </div>
      <p class="mat-muted">Bitte prüfe deine Internetverbindung und versuche es erneut.</p>
      <a class="mat-btn mat-btn--primary mat-btn--block" href="/">Erneut versuchen</a>
      <p class="mat-muted mat-small">MatPaper is offline. Check your connection and try again.</p>
    </div>
  </main>
</body>
</html>
